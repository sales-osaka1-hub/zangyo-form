<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>残業 申請・実績報告</title>
<style>
  :root{
    --bg:#f4f6f9; --card:#ffffff; --ink:#1f2933; --sub:#52606d;
    --line:#d7dde5; --brand:#1a56b0; --brand2:#133f82;
    --ok:#1f7a43; --okbg:#e4f4ea; --err:#b3261e; --errbg:#fbe7e6;
    --note:#c0392b; --field:#fbfcfe;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
    line-height:1.6;}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 48px;}
  header h1{font-size:20px;margin:6px 0 2px;letter-spacing:.02em;}
  header p{margin:0 0 14px;color:var(--sub);font-size:13px;}
  .tabs{display:flex;gap:8px;margin-bottom:14px;}
  .tab{flex:1;text-align:center;padding:11px 8px;border:1px solid var(--line);
    background:#eef2f7;color:var(--sub);border-radius:10px;font-weight:700;font-size:15px;cursor:pointer;
    user-select:none;}
  .tab.active{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 2px 6px rgba(26,86,176,.25);}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px 16px;box-shadow:0 1px 3px rgba(20,40,80,.06);}
  .field{margin-bottom:15px;}
  label{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px;}
  .req::after{content:"必須";font-size:10px;color:#fff;background:var(--brand);
    border-radius:4px;padding:1px 6px;margin-left:7px;vertical-align:middle;font-weight:700;}
  select,input{width:100%;padding:12px 12px;font-size:16px;border:1px solid var(--line);
    border-radius:9px;background:var(--field);color:var(--ink);appearance:none;-webkit-appearance:none;}
  select:focus,input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(26,86,176,.15);}
  .row{display:flex;gap:10px;}
  .row>.field{flex:1;margin-bottom:15px;}
  .note{color:var(--note);font-weight:700;font-size:12.5px;margin-top:7px;display:block;line-height:1.5;}
  .auto{background:#eef3fb;border-color:#c5d6ef;color:var(--brand2);font-weight:700;}
  .hint{font-size:12px;color:var(--sub);margin-top:5px;}
  button.submit{width:100%;padding:15px;font-size:17px;font-weight:800;color:#fff;background:var(--brand);
    border:none;border-radius:11px;cursor:pointer;margin-top:4px;letter-spacing:.04em;
    box-shadow:0 3px 8px rgba(26,86,176,.3);}
  button.submit:active{transform:translateY(1px);}
  button.submit:disabled{background:#9db4d6;box-shadow:none;cursor:default;}
  .msg{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14px;font-weight:700;display:none;}
  .msg.ok{display:block;background:var(--okbg);color:var(--ok);border:1px solid #bfe3cd;}
  .msg.err{display:block;background:var(--errbg);color:var(--err);border:1px solid #f0c7c4;}
  .pane{display:none;}
  .pane.active{display:block;}
  .loading{text-align:center;color:var(--sub);padding:28px 0;font-size:14px;}
  .foot{margin-top:18px;text-align:center;color:#8893a0;font-size:11.5px;line-height:1.7;}
  .reload{color:var(--brand);text-decoration:underline;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>残業　申請・実績報告</h1>
    <p>全社共通フォーム（ログイン不要・スマホ可）</p>
  </header>

  <div class="tabs">
    <div class="tab active" id="tabPlan" onclick="showTab('plan')">① 予定登録</div>
    <div class="tab" id="tabAct" onclick="showTab('act')">② 実績報告</div>
  </div>

  <div id="loading" class="card loading">名簿を読み込んでいます…</div>

  <!-- 予定登録 -->
  <div id="panePlan" class="pane">
    <div class="card">
      <div class="field">
        <label class="req">部門</label>
        <select id="p_dept" onchange="onDeptPlan()"></select>
      </div>
      <div class="field">
        <label class="req">指示者</label>
        <select id="p_mgr" class="auto" onchange="lsSet('ot_mgr',this.value)"></select>
        <span class="hint">部門を選ぶと自動で入ります（必要なら変更可）</span>
      </div>
      <div class="field">
        <label class="req">対応者（残業する人）</label>
        <select id="p_name" onchange="lsSet('ot_name',this.value)"></select>
      </div>
      <div class="row">
        <div class="field">
          <label class="req">開始日</label>
          <input type="date" id="p_sd" onchange="syncEnd()">
        </div>
        <div class="field">
          <label class="req">終了日</label>
          <input type="date" id="p_ed">
        </div>
      </div>
      <span class="note">※終了日を変更すると、その期間（平日）をまとめて申請できます。1日だけの場合は開始日＝終了日のままでOK。</span>
      <div class="row" style="margin-top:14px;">
        <div class="field">
          <label class="req">予定開始</label>
          <input type="time" id="p_st" value="18:00">
        </div>
        <div class="field">
          <label class="req">予定終了</label>
          <input type="time" id="p_et" value="18:30">
        </div>
      </div>
      <div class="field">
        <label>指示内容・業務</label>
        <input type="text" id="p_task" placeholder="例：繁忙期の○○案件対応">
      </div>
      <button class="submit" id="p_btn" onclick="doPlan()">この内容で予定登録する</button>
      <div class="msg" id="p_msg"></div>
    </div>
  </div>

  <!-- 実績報告 -->
  <div id="paneAct" class="pane">
    <div class="card">
      <div class="field">
        <label class="req">部門</label>
        <select id="a_dept" onchange="onDeptAct()"></select>
      </div>
      <div class="field">
        <label class="req">対応者（あなた）</label>
        <select id="a_name" onchange="lsSet('ot_name',this.value)"></select>
      </div>
      <div class="field">
        <label class="req">日付</label>
        <input type="date" id="a_date">
      </div>
      <div class="field">
        <label class="req">実績終了（実際に終えた時刻）</label>
        <input type="time" id="a_et">
      </div>
      <span class="note">※事前に「①予定登録」された予定に対して実績を記録します。該当がない場合は先に予定登録してください。</span>
      <button class="submit" id="a_btn" onclick="doAct()" style="margin-top:14px;">実績を報告する</button>
      <div class="msg" id="a_msg"></div>
    </div>
  </div>

  <div class="foot">
    デジタル総合印刷　残業管理システム<br>
    うまく表示されない場合は <span class="reload" onclick="location.reload()">再読み込み</span> してください。
  </div>
</div>

<script>
var API='https://script.google.com/macros/s/AKfycbwAXZ3p1LWGjM_SMngdk0bqmkvmW8GDRY0SzriiiiQwXNYxrrHZtfcgZGK1fZuKTbrVjA/exec';
var R=null;

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function todayStr(){var d=new Date();var m=('0'+(d.getMonth()+1)).slice(-2);var day=('0'+d.getDate()).slice(-2);return d.getFullYear()+'-'+m+'-'+day;}
function opt(v){var o=document.createElement('option');o.value=v;o.textContent=v;return o;}
function fill(sel,arr,chosen){sel.innerHTML='';var ph=document.createElement('option');ph.value='';ph.textContent='選択してください';sel.appendChild(ph);
  (arr||[]).forEach(function(v){sel.appendChild(opt(v));});
  if(chosen && (arr||[]).indexOf(chosen)>=0) sel.value=chosen;}

function showTab(t){
  document.getElementById('tabPlan').classList.toggle('active',t==='plan');
  document.getElementById('tabAct').classList.toggle('active',t==='act');
  document.getElementById('panePlan').classList.toggle('active',t==='plan');
  document.getElementById('paneAct').classList.toggle('active',t==='act');
  if(t==='act') syncActFromLast();
  if(t==='plan') syncPlanFromLast();
}
function syncActFromLast(){
  if(!R) return;
  var d=lsGet('ot_dept')||'';
  if(d && (R.depts||[]).indexOf(d)>=0){ document.getElementById('a_dept').value=d; onDeptAct(); }
}
function syncPlanFromLast(){
  if(!R) return;
  var d=lsGet('ot_dept')||'';
  if(d && (R.depts||[]).indexOf(d)>=0){ document.getElementById('p_dept').value=d; onDeptPlan(); }
}

function onDeptPlan(){
  var d=document.getElementById('p_dept').value;
  lsSet('ot_dept',d);
  // 指示者：部門に紐づく指示者を既定に（全指示者から選択可）
  var mgrSel=document.getElementById('p_mgr');
  var defMgr=(R.mgrByDept&&R.mgrByDept[d])||'';
  fill(mgrSel,R.mgrs,defMgr||lsGet('ot_mgr')||'');
  // 対応者：その部門のみ
  fill(document.getElementById('p_name'),R.staffByDept[d]||[],lsGet('ot_name')||'');
}
function onDeptAct(){
  var d=document.getElementById('a_dept').value;
  lsSet('ot_dept',d);
  fill(document.getElementById('a_name'),R.staffByDept[d]||[],lsGet('ot_name')||'');
}
function syncEnd(){
  var sd=document.getElementById('p_sd').value;
  var ed=document.getElementById('p_ed');
  if(!ed.value || ed.value<sd) ed.value=sd;
}

function setMsg(id,type,text){var m=document.getElementById(id);m.className='msg '+type;m.textContent=text;}
function clrMsg(id){var m=document.getElementById(id);m.className='msg';m.textContent='';}

function post(payload){
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})
    .then(function(r){return r.json();});
}

function doPlan(){
  var dept=document.getElementById('p_dept').value;
  var mgr=document.getElementById('p_mgr').value;
  var name=document.getElementById('p_name').value;
  var sd=document.getElementById('p_sd').value, ed=document.getElementById('p_ed').value;
  var st=document.getElementById('p_st').value, et=document.getElementById('p_et').value;
  var task=document.getElementById('p_task').value;
  if(!dept||!mgr||!name||!sd||!ed||!st||!et){setMsg('p_msg','err','未入力の必須項目があります。');return;}
  if(ed<sd){setMsg('p_msg','err','終了日は開始日以降にしてください。');return;}
  lsSet('ot_dept',dept);lsSet('ot_mgr',mgr);lsSet('ot_name',name);
  var btn=document.getElementById('p_btn');btn.disabled=true;var old=btn.textContent;btn.textContent='送信中…';clrMsg('p_msg');
  post({action:'plan',dept:dept,mgr:mgr,name:name,startD:sd,endD:ed,startT:st,endT:et,task:task})
   .then(function(j){
     if(j&&j.ok){setMsg('p_msg','ok','予定を登録しました'+(j.count?'（'+j.count+'日分）':'')+'。お疲れさまです。');
       document.getElementById('p_task').value='';}
     else{setMsg('p_msg','err',(j&&j.msg)||'登録に失敗しました。もう一度お試しください。');}
   })
   .catch(function(){setMsg('p_msg','err','通信エラーが発生しました。電波状況を確認して再度お試しください。');})
   .then(function(){btn.disabled=false;btn.textContent=old;});
}

function doAct(){
  var name=document.getElementById('a_name').value;
  var date=document.getElementById('a_date').value;
  var et=document.getElementById('a_et').value;
  if(!name||!date||!et){setMsg('a_msg','err','未入力の必須項目があります。');return;}
  lsSet('ot_dept',document.getElementById('a_dept').value);lsSet('ot_name',name);
  var btn=document.getElementById('a_btn');btn.disabled=true;var old=btn.textContent;btn.textContent='送信中…';clrMsg('a_msg');
  post({action:'actual',name:name,date:date,endT:et})
   .then(function(j){
     if(j&&j.ok){setMsg('a_msg','ok','実績を登録しました。お疲れさまでした。');}
     else{setMsg('a_msg','err',(j&&j.msg)||'登録に失敗しました。');}
   })
   .catch(function(){setMsg('a_msg','err','通信エラーが発生しました。電波状況を確認して再度お試しください。');})
   .then(function(){btn.disabled=false;btn.textContent=old;});
}

function init(j){
  if(!j||!j.ok||!j.roster){document.getElementById('loading').innerHTML='名簿の読み込みに失敗しました。<span class="reload" onclick="location.reload()">再読み込み</span>';return;}
  R=j.roster;
  var lastDept=lsGet('ot_dept')||'';
  fill(document.getElementById('p_dept'),R.depts,lastDept);
  fill(document.getElementById('a_dept'),R.depts,lastDept);
  document.getElementById('p_sd').value=todayStr();
  document.getElementById('p_ed').value=todayStr();
  document.getElementById('a_date').value=todayStr();
  if(lastDept){onDeptPlan();onDeptAct();}
  document.getElementById('loading').style.display='none';
  document.getElementById('panePlan').classList.add('active');
}

fetch(API,{method:'GET'})
  .then(function(r){return r.json();})
  .then(init)
  .catch(function(){document.getElementById('loading').innerHTML='名簿の読み込みに失敗しました。<span class="reload" onclick="location.reload()">再読み込み</span>';});
</script>
</body>
</html>
